name: Integration lab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integration/**'
      - '.github/workflows/integration.yml'
  push:
    paths:
      - 'integration/**'
      - '.github/workflows/integration.yml'
permissions:
  contents: read
jobs:
  isolated-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p sdh-ci -f integration/compose.yaml up --build --abort-on-container-exit --exit-code-from tests tests
      - if: always()
        run: docker compose -p sdh-ci -f integration/compose.yaml down -v --remove-orphans
